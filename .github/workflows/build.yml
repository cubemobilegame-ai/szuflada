name: Build Android
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uporzadkuj pliki (jesli wgrano je bez folderow)
        run: |
          mkdir -p lib tool
          for f in add claim core letters main pages services; do
            if [ -f "$f.dart" ]; then mv "$f.dart" lib/; fi
          done
          if [ -f setup_android.py ]; then mv setup_android.py tool/; fi
          ls -R lib tool
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Wygeneruj projekt Androida, jesli go brak
        run: |
          if [ ! -d android ]; then
            cp -r lib /tmp/lib_bak && cp pubspec.yaml /tmp/pubspec_bak
            flutter create --platforms=android --org pl.szuflada --project-name szuflada .
            rm -rf lib test && cp -r /tmp/lib_bak lib && cp /tmp/pubspec_bak pubspec.yaml
          fi
          python3 tool/setup_android.py
      - name: Dopasuj ustawienia Androida (compileSdk, R8)
        run: |
          python3 - <<'PY'
          import re, os
          for g, kts in [('android/app/build.gradle.kts', 1), ('android/app/build.gradle', 0)]:
              if os.path.exists(g):
                  t = open(g).read()
                  t = re.sub(r'compileSdk(Version)?\s*=?\s*flutter\.compileSdkVersion', 'compileSdk = 36' if kts else 'compileSdk 36', t)
                  if 'inifyEnabled' not in t:
                      add = 'isMinifyEnabled = false\n            isShrinkResources = false\n            ' if kts else 'minifyEnabled false\n            shrinkResources false\n            '
                      t = re.sub(r'(release\s*\{)', lambda m: m.group(1) + '\n            ' + add, t, count=1)
                  open(g, 'w').write(t)
                  print(open(g).read())
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: szuflada
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
