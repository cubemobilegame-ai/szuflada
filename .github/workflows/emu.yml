name: Emulator (prawdziwy APK)
on:
  push:
    branches: ['emu/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz APK z najnowszego wydania
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tag=$(gh release list -L 1 --json tagName -q '.[0].tagName'); echo "$tag" > /tmp/tag.txt
          gh release download "$tag" -p app-release.apk -O app.apk && ls -la app.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tool/emu.sh
      - name: Wyniki na galaz emu-logs
        if: always()
        run: |
          mkdir -p /tmp/emu && cp /tmp/tag.txt /tmp/emu/ 2>/dev/null || true
          cd /tmp/emu && git init -q && git checkout -q -b emu-logs && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "emu ${{ github.run_number }} ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" emu-logs
