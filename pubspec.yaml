name: szuflada
description: Paragony i gwarancje w jednym miejscu
publish_to: none
version: 1.1.0+3
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter: {sdk: flutter}
  flutter_localizations: {sdk: flutter}
  intl: ">=0.19.0 <1.0.0"
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  google_mlkit_document_scanner: ^0.3.0
  google_mlkit_text_recognition: ^0.13.1
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  in_app_purchase: ^3.2.0
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  share_plus: ^10.1.0
  file_picker: ^8.1.2
  archive: ^3.6.1
  pdf: ^3.11.1
  printing: ^5.13.2
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#121214"
  adaptive_icon_foreground: "assets/icon_fg.png"
  adaptive_icon_monochrome: "assets/icon_mono.png"
